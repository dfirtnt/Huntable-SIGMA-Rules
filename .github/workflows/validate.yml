name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Sigma Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install pinned toolchain
        run: python -m pip install --quiet -r requirements-ci.txt

      - name: YAML syntax
        run: yamllint -c .yamllint.yml rules/

      # Parse errors (unknown modifier, malformed condition) and the blocking
      # validator set. See .sigma/validation-blocking.yml for what and why.
      - name: Sigma validation (blocking)
        run: >-
          sigma check
          --fail-on-error --fail-on-issues
          --validation-config .sigma/validation-blocking.yml
          rules/

      - name: Duplicate detection logic
        run: python3 scripts/check_duplicate_detections.py rules/

      # Style, SigmaHQ conventions, and ATT&CK-tag membership against
      # pySigma's bundled dataset. Printed for the reviewer; never fails.
      - name: Sigma validation (advisory, non-blocking)
        run: >-
          sigma check
          --pass-on-error --pass-on-issues
          --validation-config .sigma/validation-advisory.yml
          rules/
