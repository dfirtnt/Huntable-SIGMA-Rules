title: Outbound Connection to IPv4 Literal on Non-Standard Port
id: 2a8e1c73-6b42-4d9f-ae15-9c7f3b5d8210
status: experimental
description: Detects outbound Windows network connections to an IPv4 literal on a
  non-standard port associated with payload transfer.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    DestinationIp|re: ^[0-9]{1,3}(\.[0-9]{1,3}){3}$
    DestinationPort: 8899
  condition: selection
falsepositives:
- Internal software distribution
- Administrative file transfer utilities
level: medium
