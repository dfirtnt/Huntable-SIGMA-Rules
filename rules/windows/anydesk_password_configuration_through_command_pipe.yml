title: AnyDesk Password Configuration Through Command Pipe
id: 7c2e9f14-a6b8-4d53-91f0-5e7a3c8b6249
status: experimental
description: Detects AnyDesk being configured with a password through a command-line
  pipeline, which may establish unauthorized remote access.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.command-and-control
- attack.t1219
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \AnyDesk.exe
  selection_original:
    OriginalFileName: AnyDesk.exe
  selection_cli:
    CommandLine|contains: --set-password
  condition: (selection_image or selection_original) and selection_cli
falsepositives:
- Authorized remote-support software deployment and configuration
level: medium
