title: PowerShell Execution Policy Bypass from User Temp Directory
id: 9d8e36c1-5bf3-4d9a-8cd7-16ba1e9ebf07
status: experimental
description: Detects PowerShell bypassing execution policy to run a script from a
  user's temporary directory, a common payload-staging pattern.
references:
- https://www.huntress.com/blog/komari-c2-agent-abuse
author: Huntable CTI Studio
date: '2026-09-03'
tags:
- attack.execution
- attack.t1059.001
- attack.defense-evasion
- attack.t1685
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith:
    - \powershell.exe
    - \pwsh.exe
  - OriginalFileName:
    - PowerShell.EXE
    - pwsh.dll
  selection_cli:
    CommandLine|contains|all:
    - ExecutionPolicy
    - Bypass
    - -File
    - \AppData\Local\Temp\
  condition: all of selection_*
falsepositives:
- Software installers or enterprise automation invoking temporary PowerShell scripts
  with a bypassed execution policy
level: medium
