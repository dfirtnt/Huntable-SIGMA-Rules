title: Curl Downloading PowerShell Script to User Temp Directory
id: 7dc0a1b8-fdb2-4ff4-a73e-45aca169c2c6
status: experimental
description: Detects curl downloading a PowerShell script into a user's local temporary directory, as observed during post-exploitation of AhsayCBS systems.
references:
  - https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Huntable CTI Studio
date: 2026-10-12
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\curl.exe'
    OriginalFileName: 'curl.exe'
  selection_command:
    CommandLine|contains|all:
      - 'AppData\Local\Temp\'
      - '.ps1'
    CommandLine|contains|windash: ' -o '
  condition: 'all of selection_*'
falsepositives:
  - Administrative scripts downloading PowerShell tooling to temporary directories
  - Software deployment or maintenance automation using curl
level: medium