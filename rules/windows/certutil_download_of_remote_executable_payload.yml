title: Certutil Download of Remote Executable Payload
id: 8e4c1a72-3b9d-4f16-a6c2-71d5e9b0f843
status: experimental
description: Detects certutil using its URL cache functionality to download a remote
  executable, a signed binary proxy transfer pattern that may stage malware on disk.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \certutil.exe
  selection_original:
    OriginalFileName: certutil.exe
  selection_cli:
    CommandLine|contains|all:
    - urlcache
    - split
    - ' -f '
  condition: (selection_image or selection_original) and selection_cli
falsepositives:
- Administrators downloading trusted certificates or software components with certutil
level: medium
