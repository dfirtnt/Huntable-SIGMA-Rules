title: FSUtil Symlink Evaluation Modification
description: Detects fsutil command execution modifying symlink evaluation settings,
  which can enable lateral movement or evasion behaviors.
id: 3fbdca14-e78a-4fae-bae2-bf72478c1803
author: Huntable CTI Studio
date: 2026-04-08
tags:
- attack.defense-evasion
- attack.t1562
level: medium
status: experimental
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    ParentImage|endswith: \cmd.exe
    Image|endswith: \fsutil.exe
    CommandLine|contains|all:
    - behavior
    - set
    - SymlinkEvaluation
  condition: selection
