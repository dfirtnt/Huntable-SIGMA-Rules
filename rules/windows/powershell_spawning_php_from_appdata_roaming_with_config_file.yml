title: PowerShell Spawning PHP From AppData Roaming With Config File
description: Detects PowerShell launching a PHP interpreter from a user AppData Roaming
  directory with ZIP extension directives and a local CFG file, a suspicious execution
  pattern associated with Interlock RAT delivery.
id: 01ac4454-82ad-4b6f-a0d9-2b441c24db3d
tags:
- attack.execution
- attack.t1059.001
level: medium
status: experimental
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith: \powershell.exe
  selection_image:
    Image|endswith: \php.exe
  selection_cli:
    CommandLine|contains|all:
    - \AppData\Roaming\php\
    - -d extension=zip
    - -d extension_dir=ext
    - .cfg
  condition: selection_parent and selection_image and selection_cli
