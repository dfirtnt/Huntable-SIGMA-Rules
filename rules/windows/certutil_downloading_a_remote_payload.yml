title: Certutil Downloading a Remote Payload
id: 7c2c5f4d-8a19-4f63-bd2d-0f6e4a9c1b77
status: experimental
description: Detects certutil being used with URL cache and file retrieval arguments
  to download a remote payload.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - certutil
    - -urlcache
    - -split
    - -f
  condition: selection
falsepositives:
- Administrative scripting
- Software deployment
level: high
