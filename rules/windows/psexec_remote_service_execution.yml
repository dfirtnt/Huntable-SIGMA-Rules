title: PsExec Remote Service Execution
id: 7f3b2c1e-9a64-4d87-b5e2-1c0f6a8d9347
status: experimental
description: Detects PsExec-based remote service execution with remote host targeting
  or deployment-related command-line indicators.
references:
- https://www.microsoft.com/en-us/security/blog/2026/09/24/beyond-ransomware-tracking-storm-2570-consistent-tradecraft-across-deployments/
author: Huntable CTI Studio
date: '2026-09-27'
tags:
- attack.execution
- attack.lateral-movement
- attack.t1569.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
    - \psexec.exe
    - \psexec64.exe
    CommandLine|contains:
    - '@ip.txt'
    - -accepteula
    - \
  condition: selection
falsepositives:
- Administrative software deployment
- Authorized remote system administration
level: medium
