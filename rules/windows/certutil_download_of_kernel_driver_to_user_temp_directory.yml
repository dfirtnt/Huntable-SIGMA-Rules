title: Certutil Download of Kernel Driver to User Temp Directory
id: c7b6249d-bdb5-4bf2-a341-0858789a0eb0
status: experimental
description: Detects certutil using its URL cache functionality to download a kernel
  driver into a user AppData temporary directory.
references:
- https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Huntable CTI Studio
date: '2026-10-12'
tags:
- attack.command-and-control
- attack.t1105
- attack.defense-evasion
- attack.t1218
logsource:
  category: process_creation
  product: windows
detection:
  selection_image_path:
    Image|endswith: \certutil.exe
  selection_image_original:
    OriginalFileName: CertUtil.exe
  selection_command_urlcache:
    CommandLine|contains|windash: ' -urlcache '
  selection_command_split:
    CommandLine|contains|windash: ' -split '
  selection_command_force:
    CommandLine|contains|windash: ' -f '
  selection_command_target:
    CommandLine|contains|all:
    - \AppData\Local\Temp\
    - .sys
  condition: 1 of selection_image_* and selection_command_urlcache and selection_command_split
    and selection_command_force and selection_command_target
falsepositives:
- Administrative retrieval of hardware support drivers
- Software installation or endpoint maintenance tooling
level: high
