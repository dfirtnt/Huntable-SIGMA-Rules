title: Terminal Services Stop Command for RDP Enablement
id: 8e27c6ef-62f1-4ed1-9c74-36b8cb4ad493
status: experimental
description: Detects net.exe stopping Terminal Services with forced dependent-service
  termination, which can be used to apply RDP configuration changes.
references:
- https://www.huntress.com/blog/komari-c2-agent-abuse
author: Huntable CTI Studio
date: '2026-09-03'
tags:
- attack.lateral-movement
- attack.t1021.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
  - Image|endswith: \net.exe
  - OriginalFileName: net.exe
  selection_cli:
    CommandLine|contains|all:
    - stop
    - termservice
    - /y
  condition: all of selection_*
falsepositives:
- Administrators restarting Remote Desktop Services after configuration or maintenance
  changes
level: medium
