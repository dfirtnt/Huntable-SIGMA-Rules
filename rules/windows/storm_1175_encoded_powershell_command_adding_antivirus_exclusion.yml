title: Storm-1175 Encoded PowerShell Command Adding Antivirus Exclusion
description: Detects PowerShell ScriptBlock logging capturing a decoded -EncodedCommand
  payload that adds the C:\ drive to the Windows Defender exclusion path, indicating
  defense evasion by Storm-1175. A process_creation CommandLine only ever shows the
  base64 blob, so this targets the decoded ScriptBlockText instead.
id: 3c4d5e6f-7a8b-4901-cdef-34567890abcd
author: Huntable CTI Studio
date: 2026-04-08
tags:
- attack.t1562.001
- attack.defense-evasion
level: critical
status: experimental
logsource:
  category: ps_script
  product: windows
detection:
  selection:
    ScriptBlockText|contains|all:
    - Add-MpPreference
    - ExclusionPath
    - 'C:\'
  condition: selection
