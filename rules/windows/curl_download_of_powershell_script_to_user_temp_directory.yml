title: Curl Download of PowerShell Script to User Temp Directory
id: 4f7e3b62-44de-4ca5-91b3-aeeb82e3f5f8
status: experimental
description: Detects curl downloading a PowerShell script into a user AppData temporary
  directory.
references:
- https://www.huntress.com/blog/ahsaycbs-flaws-exploit
author: Huntable CTI Studio
date: '2026-10-12'
tags:
- attack.command-and-control
- attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image_path:
    Image|endswith: \curl.exe
  selection_image_original:
    OriginalFileName: curl.exe
  selection_command:
    CommandLine|contains|windash: ' -o '
    CommandLine|contains|all:
    - \AppData\Local\Temp\
    - .ps1
  condition: 1 of selection_image_* and selection_command
falsepositives:
- Administrative scripts downloading PowerShell tooling
- Software deployment or maintenance automation
level: high
