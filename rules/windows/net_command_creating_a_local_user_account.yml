title: Net Command Creating a Local User Account
id: 5a1d7e93-c8f4-4b62-9e0a-3d6f2c8b7145
status: experimental
description: Detects use of the Windows net command to create a local user account,
  a behavior that can establish persistence or enable unauthorized access.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1098
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: \net.exe
  selection_original:
    OriginalFileName: net.exe
  selection_cli:
    CommandLine|contains|all:
    - user
    - ' /add'
  condition: (selection_image or selection_original) and selection_cli
falsepositives:
- Help-desk or system administrators provisioning approved local accounts
level: medium
