title: Local Account Creation with Net User
id: 5b8d2e61-7f34-4a90-9c16-3e5b1d7a8f42
status: experimental
description: Detects use of net user to create a local account.
references:
- https://www.huntress.com/blog/threat-actor-compiles-cryptominer
author: Huntable CTI Studio
date: '2026-09-24'
tags:
- attack.persistence
- attack.privilege-escalation
- attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains|all:
    - net user
    - /add
  condition: selection
falsepositives:
- Help desk or system administration account provisioning
- Automated endpoint deployment
level: medium
